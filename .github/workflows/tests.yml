name: tests

on:
  push:
  pull_request:

# A newer push to the same ref supersedes the run it interrupted: this repo
# sees bursts of pushes, and every one of them used to start a full matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-chi-tra
          tesseract --version
      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract tesseract-lang
          tesseract --version
      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install tesseract --no-progress -y
          tesseract --version
          $tessdata = Join-Path $env:ProgramFiles "Tesseract-OCR\tessdata"
          if (-not (Test-Path $tessdata)) { throw "Tesseract tessdata not found" }
          foreach ($lang in @("chi_sim", "chi_tra")) {
            Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -OutFile (Join-Path $tessdata "$lang.traineddata")
          }
      - name: Add Tesseract to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles}\Tesseract-OCR",
            "C:\ProgramData\chocolatey\bin"
          )
          $found = $candidates | Where-Object {
            Test-Path (Join-Path $_ "tesseract.exe")
          }
          if (-not $found) {
            throw "Tesseract executable not found in known Windows locations"
          }
          $found | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "Added $($found -join ', ')"
      - name: Verify Tesseract languages
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          out = subprocess.run(["tesseract", "--list-langs"], capture_output=True, text=True).stdout
          langs = {line.strip() for line in out.splitlines() if line.strip()}
          missing = {"chi_sim", "chi_tra"} - langs
          if missing:
              raise SystemExit(f"missing Tesseract languages: {sorted(missing)}")
          print("Chinese OCR languages present")
          PY
      - name: Run the offline suites
        run: |
          python -I sourcefidelity-batch/scripts/test_pipeline.py
          python -I sourcefidelity-batch/scripts/test_style_signals.py
          python -I sourcefidelity-review/scripts/test_pdf_quality.py
      - name: Check the development docs
        run: python scripts/check_docs.py
