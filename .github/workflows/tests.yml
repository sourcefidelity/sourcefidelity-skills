name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes the run it interrupted: this repo
# sees bursts of pushes, and every one of them used to start a full matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-suites:
    strategy:
      fail-fast: false
      matrix:
        # Linux on every push; the macOS and Windows legs only for pull
        # requests, pushes to main, and manual runs. macOS bills at roughly
        # ten times the Linux rate, so it does not belong on every branch push.
        os: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          tesseract --version
      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract
          tesseract --version
      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install tesseract --no-progress -y
          tesseract --version
      - name: Run the offline suites
        run: |
          python -I sourcefidelity-batch/scripts/test_pipeline.py
          python -I sourcefidelity-batch/scripts/test_style_signals.py
          python -I sourcefidelity-review/scripts/test_pdf_quality.py
