name: tests

on:
  push:
  pull_request:

jobs:
  offline-suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Run the offline suites
        run: |
          python -I sourcefidelity-batch/scripts/test_pipeline.py
          python -I sourcefidelity-batch/scripts/test_style_signals.py
          python -I sourcefidelity-review/scripts/test_pdf_quality.py
